# Production serving for web/. serve.py is the dev equivalent: it gzips the
# same extensions and sends no-store so edits show up at once. Here the
# trade is reversed - the fingerprint-free assets get a short cache and the
# heavy immutable ones a long cache.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Not every nginx build knows these, and the scene will not load without
    # them: a GLB served as octet-stream is fine, but the Draco decoder has
    # to arrive as application/wasm or the browser refuses to compile it.
    types {
        application/wasm   wasm;
        model/gltf-binary  glb;
        image/webp         webp;
        font/woff2         woff2;
        font/ttf           ttf;
        font/otf           otf;
    }

    access_log  off;
    sendfile    on;
    tcp_nopush  on;

    # `model/gltf-binary` is in this list and it is the single most important
    # entry: scene.glb is 12.52 MB on disk and 9.31 MB gzipped. Its Draco
    # buffers and its embedded WebP do not compress at all - what does is the
    # 1.2 MB glTF JSON chunk, and leaving the type out of `gzip_types` put
    # 3.2 MB back onto every first load in production while the dev server
    # sent the small one. Level 6 is enough: 9 saves 10 KB of 9.3 MB, and
    # brotli measures WORSE here (9.33 MB) because there is so little left to
    # compress.
    #
    # `font/woff2` is deliberately NOT here - woff2 is Brotli already, and
    # gzipping it only costs CPU to make it very slightly bigger.
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript text/javascript
                      application/json image/svg+xml application/wasm
                      model/gltf-binary;

    server {
        listen      8080;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # The GLB, the textures and the fonts are rebuilt under new content
        # rather than edited in place, so they can be held for a year.
        location ~* \.(glb|wasm|woff2?|ttf|otf|webp|jpg|png)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # The code has no fingerprints in its names, so it must be revalidated.
        location ~* \.(js|css|json)$ {
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
